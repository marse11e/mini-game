<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Иконка приложения: арбуз на тёплом фоне. Фрукт в безопасной зоне маски (80%) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9d8"/>
      <stop offset="1" stop-color="#ffbe98"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#bg)"/>
  <circle cx="14" cy="13" r="6" fill="#fff" opacity=".35"/>
  <circle cx="52" cy="54" r="9" fill="#fff" opacity=".2"/>
  <g transform="translate(32 33.5) scale(.74) translate(-32 -33.5)">
  
  <defs>
    <radialGradient id="body" cx="0.34" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c9f9ad"/>
      <stop offset="0.5" stop-color="#4cbf3f"/>
      <stop offset="1" stop-color="#1c7420"/>
    </radialGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b06"/>
      <stop offset="0.6" stop-color="#145a17"/>
      <stop offset="1" stop-color="#48bb3c"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="32" cy="35" r="26"/></clipPath>
  </defs>
  <!-- хвостик -->
  <path d="M32 10c0-3 3-5 6-4" fill="none" stroke="#5a8a22" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="35" r="26" fill="url(#body)"/>
  <!-- полосы -->
  <g clip-path="url(#ball)" fill="none" stroke="#1d6d22" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" opacity=".85">
    <path d="M13 9l-2 6 2 6-2 6 2 6-2 6 2 6-2 6 2 6"/>
    <path d="M23 7l-2 7 2 7-2 7 2 7-2 7 2 7-2 7"/>
    <path d="M41 7l2 7-2 7 2 7-2 7 2 7-2 7 2 7"/>
    <path d="M51 9l2 6-2 6 2 6-2 6 2 6-2 6 2 6-2 6"/>
  </g>
  <circle cx="32" cy="35" r="26" fill="none" stroke="#145a17" stroke-width="1.6" opacity=".55"/>
  <!-- блик -->
  <ellipse cx="20" cy="21" rx="7" ry="3.8" transform="rotate(-35 20 21)" fill="#fff" opacity=".7"/>
  <!-- румянец -->
  <ellipse cx="15.5" cy="44" rx="4.6" ry="2.6" fill="#ff7f9a" opacity=".8"/>
  <ellipse cx="48.5" cy="44" rx="4.6" ry="2.6" fill="#ff7f9a" opacity=".8"/>
  <!-- аниме-глаза -->
  <g>
    <ellipse cx="22.5" cy="36" rx="5" ry="6.4" fill="#fff"/>
    <ellipse cx="22.5" cy="36.6" rx="4.3" ry="5.7" fill="url(#iris)"/>
    <ellipse cx="20.9" cy="33.6" rx="1.9" ry="1.5" fill="#fff"/>
    <circle cx="24.3" cy="39" r=".9" fill="#fff"/>
    <path d="M17.3 33.3a5.2 6.6 0 0 1 10.4 0M17.6 32.6l-2.2-2" fill="none" stroke="#2b1610" stroke-width="1.6" stroke-linecap="round"/>
    <ellipse cx="41.5" cy="36" rx="5" ry="6.4" fill="#fff"/>
    <ellipse cx="41.5" cy="36.6" rx="4.3" ry="5.7" fill="url(#iris)"/>
    <ellipse cx="39.9" cy="33.6" rx="1.9" ry="1.5" fill="#fff"/>
    <circle cx="43.3" cy="39" r=".9" fill="#fff"/>
    <path d="M36.3 33.3a5.2 6.6 0 0 1 10.4 0M46.4 32.6l2.2-2" fill="none" stroke="#2b1610" stroke-width="1.6" stroke-linecap="round"/>
  </g>
  <!-- ротик -->
  <path d="M28.5 45.5q3.5 5 7 0z" fill="#5a1e14"/>
  <ellipse cx="32" cy="47.6" rx="1.9" ry="1.1" fill="#ff7f8f"/>
</g>
