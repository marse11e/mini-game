# Сайт Fruit Merge: Nginx -> Gunicorn (127.0.0.1:8000)
# Установка: скопировать в /etc/nginx/sites-available/fruit-merge,
# сделать симлинк в sites-enabled и выполнить: nginx -t && nginx -s reload
server {
    listen 80;
    # listen [::]:80;       # раскомментируйте, если на сервере есть IPv6
    server_name _;            # замените на свой домен, например game.example.com

    gzip on;
    gzip_types text/plain application/javascript text/css;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
